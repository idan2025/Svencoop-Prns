name: macOS build

# Builds the desktop GUI (gui/src-tauri, product name "Sven Co-op over
# Reticulum") for both Apple Silicon and Intel Macs on GitHub's
# Apple-licensed macos runners — there's no Linux-hosted way to produce a
# real macOS build (Tauri needs native WKWebView + Xcode toolchain, and
# cross-compiling from Linux via osxcross is both fragile and against
# Apple's SDK license).
#
# Output is UNSIGNED (no Apple Developer certificate configured as a repo
# secret). Users will need to right-click -> Open the first time, or run
# `xattr -cr /Applications/Sven\ Co-op\ over\ Reticulum.app` to clear the
# quarantine flag Gatekeeper sets on downloaded, unsigned apps.
#
# Triggers:
#   - workflow_dispatch: manual run for testing, uploads build artifacts
#     to the Actions run (Settings -> Actions -> this run -> Artifacts).
#   - release (published): runs after `gh release create` / the GitHub UI
#     publishes a release, and uploads the .dmg files onto that same
#     release. (Not triggered by tag push directly, since this repo's
#     release process pushes the tag before `gh release create` runs —
#     using the `release: published` event avoids a race where this
#     workflow tries to upload to a release that doesn't exist yet.)

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_label: arm64
          - target: x86_64-apple-darwin
            arch_label: x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Inline frontend assets
        working-directory: gui/src-tauri
        run: python3 inline-assets.py

      - name: Build
        working-directory: gui/src-tauri
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Collect + rename dmg
        id: collect
        working-directory: gui/src-tauri
        run: |
          set -euo pipefail
          version=$(grep -m1 '"version"' tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          src=$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -iname "*.dmg" | head -1)
          dst="Sven_Co-op_over_Reticulum_${version}_macos_${{ matrix.arch_label }}.dmg"
          cp "$src" "$dst"
          echo "dmg_path=gui/src-tauri/$dst" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$dst" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch_label }}
          path: ${{ steps.collect.outputs.dmg_path }}

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.collect.outputs.dmg_path }}" --clobber
