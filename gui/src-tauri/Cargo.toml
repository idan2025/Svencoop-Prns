[package]
name = "sc-rns-gui"
version = "0.1.2"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Tauri shell for the Sven Co-op over Reticulum platform GUI"

[lib]
name = "sc_rns_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sc-rns-controller = { path = "../../controller" }
sc-rns-bridge = { path = "../.." }
tauri = { version = "2", features = [] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
